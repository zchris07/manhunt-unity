# EditMode tests and a Windows build on every push and pull request (GameCI).
#
# Needs three repository secrets (Settings -> Secrets and variables -> Actions):
#   UNITY_LICENSE   contents of your Unity_lic.ulf file
#                   (Windows: C:\ProgramData\Unity\Unity_lic.ulf)
#   UNITY_EMAIL     your Unity account email
#   UNITY_PASSWORD  your Unity account password
# See https://game.ci/docs/github/activation for details.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The test runner publishes its results as a check run, which needs checks: write.
permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  # The hosted runner sometimes kills Unity (exit code 137) as it starts, with no out-of-memory
  # message and plenty of free memory, on code that passes on the next attempt. Each Unity step
  # therefore runs once more if the first attempt fails; a real failure fails both attempts.
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-test-

      - uses: game-ci/unity-test-runner@v4
        id: tests_first
        continue-on-error: true
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results

      - uses: game-ci/unity-test-runner@v4
        id: tests_retry
        if: steps.tests_first.outcome == 'failure'
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results (retry)

      - name: Unity kernel and memory diagnostics
        if: failure()
        shell: bash {0}
        run: |
          echo "== memory"; free -m
          echo "== kernel log tail"; sudo dmesg -T 2>&1 | tail -15
          echo "== kernel kills"; sudo dmesg -T 2>&1 | grep -iE "killed process|out of memory|oom|segfault" | tail -30
          echo "== docker"; docker ps -a --no-trunc --format '{{.Status}} {{.Image}}' | head

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts

  build:
    name: Windows build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-StandaloneWindows64-

      - uses: game-ci/unity-builder@v4
        id: build_first
        continue-on-error: true
        with:
          targetPlatform: StandaloneWindows64
          buildName: Manhunt
          versioning: None

      - uses: game-ci/unity-builder@v4
        id: build_retry
        if: steps.build_first.outcome == 'failure'
        with:
          targetPlatform: StandaloneWindows64
          buildName: Manhunt
          versioning: None

      - name: Unity kernel and memory diagnostics
        if: failure()
        shell: bash {0}
        run: |
          echo "== memory"; free -m
          echo "== kernel log tail"; sudo dmesg -T 2>&1 | tail -15
          echo "== kernel kills"; sudo dmesg -T 2>&1 | grep -iE "killed process|out of memory|oom|segfault" | tail -30
          echo "== docker"; docker ps -a --no-trunc --format '{{.Status}} {{.Image}}' | head

      - uses: actions/upload-artifact@v4
        with:
          name: Manhunt-Windows
          path: build/StandaloneWindows64
