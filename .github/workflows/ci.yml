# EditMode tests and a Windows build on every push and pull request (GameCI).
#
# Needs three repository secrets (Settings -> Secrets and variables -> Actions):
#   UNITY_LICENSE   contents of your Unity_lic.ulf file
#                   (Windows: C:\ProgramData\Unity\Unity_lic.ulf)
#   UNITY_EMAIL     your Unity account email
#   UNITY_PASSWORD  your Unity account password
# See https://game.ci/docs/github/activation for details.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The test runner publishes its results as a check run, which needs checks: write.
permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      # Unity is sometimes killed for memory on the hosted runner (exit code 137); add swap.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-test-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results

      - name: Why was Unity killed? (kernel log and memory)
        if: failure()
        shell: bash {0}
        run: |
          echo "== memory"; free -m
          echo "== cgroup"; cat /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.peak 2>&1 | head -20; echo "== psi"; cat /proc/pressure/memory 2>&1
          echo "== kernel kills"; (sudo dmesg -T 2>&1 || sudo journalctl -k --no-pager 2>&1) | grep -iE "killed process|out of memory|oom|segfault" | tail -30
          echo "== docker"; docker ps -a --no-trunc --format '{{.Status}} {{.Image}}' | head; docker events --since 15m --until 0s --filter event=oom --filter event=die 2>/dev/null | tail -10
          echo "== disk"; df -h / /mnt | cat

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  build:
    name: Windows build
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Unity is sometimes killed for memory on the hosted runner (exit code 137); add swap.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-StandaloneWindows64-

      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneWindows64
          buildName: Manhunt

      - name: Why was Unity killed? (kernel log and memory)
        if: failure()
        shell: bash {0}
        run: |
          echo "== memory"; free -m
          echo "== cgroup"; cat /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.peak 2>&1 | head -20; echo "== psi"; cat /proc/pressure/memory 2>&1
          echo "== kernel kills"; (sudo dmesg -T 2>&1 || sudo journalctl -k --no-pager 2>&1) | grep -iE "killed process|out of memory|oom|segfault" | tail -30
          echo "== docker"; docker ps -a --no-trunc --format '{{.Status}} {{.Image}}' | head; docker events --since 15m --until 0s --filter event=oom --filter event=die 2>/dev/null | tail -10
          echo "== disk"; df -h / /mnt | cat

      - uses: actions/upload-artifact@v4
        with:
          name: Manhunt-Windows
          path: build/StandaloneWindows64
