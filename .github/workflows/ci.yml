# EditMode tests and a Windows build on every push and pull request (GameCI).
#
# Needs three repository secrets (Settings -> Secrets and variables -> Actions):
#   UNITY_LICENSE   contents of your Unity_lic.ulf file
#                   (Windows: C:\ProgramData\Unity\Unity_lic.ulf)
#   UNITY_EMAIL     your Unity account email
#   UNITY_PASSWORD  your Unity account password
# See https://game.ci/docs/github/activation for details.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-test-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  build:
    name: Windows build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-StandaloneWindows64-

      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneWindows64
          buildName: Manhunt

      - uses: actions/upload-artifact@v4
        with:
          name: Manhunt-Windows
          path: build/StandaloneWindows64
